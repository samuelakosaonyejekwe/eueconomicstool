html{background:#f3f5fa}@media (prefers-color-scheme:dark){html{background:#0c0f15;color:#f4f6fa}}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#boot{text-align:center;padding:28vh 20px 0;opacity:.8}
#boot i{display:block;width:34px;height:34px;margin:0 auto 12px;border-radius:50%;border:3px solid rgba(128,140,170,.35);border-top-color:#1b4dc0;animation:bsp 1s linear infinite}
@keyframes bsp{to{transform:rotate(360deg)}}
</style>

<body>
<div id="root"><div id="boot"><i></i>Opening EU Stability Compass…</div></div>
<noscript><p style="padding:24px;font:16px system-ui">EU Stability Compass needs JavaScript to fetch and chart live statistics. Please enable it and reload.</p></noscript>
<script type="module">
// Loader. Finds the newest published commit of the tool and starts exactly that
// version from a content delivery network, so every change to the repository
// goes live by itself. If that version is slow to arrive or unavailable, a
// recent copy is used instead, so nobody waits.
const REPO = 'samuelakosaonyejekwe/eueconomicstool';
const CDN = 'https://cdn.jsdelivr.net/gh/' + REPO + '@';
const KEY = 'esc.rev';
const dev = /^(localhost|127\.|\[::1\])/.test(location.hostname) || location.protocol === 'file:';
let rev = null;
try { rev = JSON.parse(localStorage.getItem(KEY)); } catch (e) { /* storage blocked */ }
if (!rev || !/^[0-9a-f]{40}$/.test(rev.sha || '')) rev = null;
const wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms, null); }); };
async function lookup() {
  try {
    const r = await fetch('https://api.github.com/repos/' + REPO + '/commits/main', { headers: { Accept: 'application/vnd.github.sha' }, cache: 'no-store' });
    const sha = r.ok ? (await r.text()).trim() : '';
    if (/^[0-9a-f]{40}$/.test(sha)) { rev = { sha: sha, at: Date.now() }; try { localStorage.setItem(KEY, JSON.stringify(rev)); } catch (e) { /* storage blocked */ } }
  } catch (e) { /* offline or over the hourly allowance */ }
}
(async function () {
  if (!rev && !dev) await Promise.race([lookup(), wait(1500)]);
  window.__esc = { repo: REPO, cdn: CDN, key: KEY, dev: dev, rev: rev };
  const stored = new URL('./', document.baseURI).href;
  // Three copies, in order of freshness: the newest commit, the CDN's own recent
  // copy of the main branch, and the copy stored with this page. Each later one
  // is started only if nothing is on screen after a short wait, and the first
  // copy that is fully downloaded takes the page.
  const tiers = dev ? [stored] : (rev ? [CDN + rev.sha + '/'] : []).concat([CDN + 'main/', stored]);
  let i = 0;
  const next = function () {
    if (window.__escClaim || i >= tiers.length) return;
    const base = tiers[i++];
    const timer = setTimeout(next, 1200);
    import(base + 'js/boot.js').then(function (boot) { return boot.run(base); }).then(function () { clearTimeout(timer); }, function () { clearTimeout(timer); next(); });
  };
  next();
})();
</script>
<script nomodule>document.getElementById('root').innerHTML='<p style="padding:24px;font:16px system-ui">This browser is too old to run the tool. Please update it, or open the page in a current version of Chrome, Edge, Firefox or Safari.</p>';</script>
</body>
